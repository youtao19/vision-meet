openapi: 3.0.3
info:
  title: Career Agent API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /healthz:
    get:
      summary: Health Check
      responses:
        "200":
          description: OK

  /api/v1/jobs:
    get:
      summary: List Jobs
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: industry
          schema:
            type: string
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsListResponse"

  /api/v1/jobs/import:
    post:
      summary: Import Jobs File
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobImportResponse"
        "400":
          description: Invalid import request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/profile/generate:
    post:
      summary: Generate Job Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id:
                  type: integer
                  minimum: 1
                force_regenerate:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Profile result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobProfileGenerateResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/profile:
    get:
      summary: List Student Profiles
      responses:
        "200":
          description: Student profile list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListStudentProfilesResponse"
    post:
      summary: Create Student Profile From Form Input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentProfileRequest"
      responses:
        "201":
          description: Created profile with completeness and competitiveness scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/profile/resume:
    post:
      summary: Create Student Profile From Resume
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, target_role]
              properties:
                file:
                  type: string
                  format: binary
                  description: 简历文件
                target_role:
                  type: string
                  minLength: 1
                name:
                  type: string
                parse_mode:
                  type: string
                  enum: [strict, tolerant]
                  default: tolerant
      responses:
        "201":
          description: Created student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Resume parse failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/matches:
    post:
      summary: Create Job Match Result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequest"
      responses:
        "201":
          description: Match result created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultDetail"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student profile or job profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List Job Match Results
      parameters:
        - in: query
          name: student_profile_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: job_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Match result list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultListResponse"
        "400":
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/matches/{match_id}:
    get:
      summary: Get Match Result Detail
      parameters:
        - in: path
          name: match_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Match result detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultDetail"
        "404":
          description: Match result not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/knowledge/index:
    post:
      summary: Index Knowledge Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeIndexRequest"
      responses:
        "201":
          description: Knowledge indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIndexResponse"
        "400":
          description: Invalid knowledge index request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/knowledge/search:
    post:
      summary: Search Knowledge Chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchRequest"
      responses:
        "200":
          description: Knowledge search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResponse"
        "400":
          description: Invalid knowledge search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/knowledge/evaluations:
    post:
      summary: Evaluate Knowledge Retrieval Baseline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeEvaluationRequest"
      responses:
        "200":
          description: Evaluation metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEvaluationResponse"
        "400":
          description: Invalid knowledge evaluation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/agent/tasks:
    post:
      summary: Create Agent Task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskRequest"
      responses:
        "201":
          description: Agent task completed or partially completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskResponse"
        "400":
          description: Invalid agent request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student profile or job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Agent orchestration or model call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/agent/tasks/{task_id}:
    get:
      summary: Get Agent Task
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Agent task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskResponse"
        "404":
          description: Agent task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/reports:
    post:
      summary: Create Career Report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Career report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReportRecord"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Match result not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List Career Reports By Match
      parameters:
        - in: query
          name: match_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Career report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "400":
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Match result not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/reports/{report_id}:
    get:
      summary: Get Career Report Detail
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Career report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReportRecord"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      summary: Update Career Report Sections
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: Career report updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReportRecord"
        "400":
          description: Invalid report sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/reports/{report_id}/exports:
    post:
      summary: Create Career Report Export
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportExportRequest"
      responses:
        "201":
          description: Career report export created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReportExportRecord"
        "400":
          description: Invalid export request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Export generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List Career Report Exports
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Career report export list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExportListResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/report-exports/{export_id}/download:
    get:
      summary: Download Career Report Export
      parameters:
        - in: path
          name: export_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Export not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    DimensionScores:
      type: object
      required:
        [base_requirements, professional_skills, professional_quality, development_potential]
      properties:
        base_requirements:
          type: number
          minimum: 0
          maximum: 100
        professional_skills:
          type: number
          minimum: 0
          maximum: 100
        professional_quality:
          type: number
          minimum: 0
          maximum: 100
        development_potential:
          type: number
          minimum: 0
          maximum: 100

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          nullable: true
        trace_id:
          type: string

    JobRecord:
      type: object
      required: [id, title, raw_payload, created_at]
      properties:
        id:
          type: integer
        source_row_id:
          type: string
          nullable: true
        title:
          type: string
        location:
          type: string
          nullable: true
        salary_range:
          type: string
          nullable: true
        company_name:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        company_size:
          type: string
          nullable: true
        company_type:
          type: string
          nullable: true
        job_code:
          type: string
          nullable: true
        job_description:
          type: string
          nullable: true
        company_intro:
          type: string
          nullable: true
        raw_payload:
          type: object
        created_at:
          type: string
          format: date-time

    JobsListResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobRecord"

    JobImportResponse:
      type: object
      required: [imported, skipped, message]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        message:
          type: string

    JobProfileGenerateResponse:
      type: object
      required:
        [
          id,
          job_id,
          profile_version,
          hard_skills,
          certificates,
          soft_skills,
          skill_weights,
          summary,
          confidence,
          created_at,
          cached,
        ]
      properties:
        id:
          type: integer
        job_id:
          type: integer
        profile_version:
          type: integer
        hard_skills:
          type: array
          items:
            type: string
        certificates:
          type: array
          items:
            type: string
        soft_skills:
          type: array
          items:
            type: string
        skill_weights:
          type: object
          additionalProperties:
            type: number
        summary:
          type: string
        confidence:
          type: number
        created_at:
          type: string
          format: date-time
        cached:
          type: boolean

    CreateStudentProfileRequest:
      type: object
      required: [name, target_role, skills]
      properties:
        name:
          type: string
        target_role:
          type: string
        education_level:
          type: string
        major:
          type: string
        graduation_year:
          type: integer
          minimum: 2000
          maximum: 2100
        skills:
          type: array
          minItems: 1
          items:
            type: string
        certificates:
          type: array
          items:
            type: string
        experience:
          type: object
          properties:
            internship_count:
              type: integer
              minimum: 0
            project_count:
              type: integer
              minimum: 0
            competition_count:
              type: integer
              minimum: 0
        self_assessment:
          type: object
          properties:
            communication:
              type: integer
              minimum: 1
              maximum: 5
            learning:
              type: integer
              minimum: 1
              maximum: 5
            stress_tolerance:
              type: integer
              minimum: 1
              maximum: 5
            innovation:
              type: integer
              minimum: 1
              maximum: 5
        personal_summary:
          type: string

    StudentProfile:
      type: object
      required:
        [
          id,
          source_type,
          source_digest,
          name,
          target_role,
          skills,
          dimension_scores,
          completeness_score,
          competitiveness_score,
          created_at,
        ]
      properties:
        id:
          type: integer
        source_type:
          type: string
          enum: [manual, resume]
        source_digest:
          type: string
        name:
          type: string
        target_role:
          type: string
        education_level:
          type: string
          nullable: true
        major:
          type: string
          nullable: true
        graduation_year:
          type: integer
          nullable: true
        skills:
          type: array
          items:
            type: string
        certificates:
          type: array
          items:
            type: string
        experience:
          type: object
          properties:
            internship_count:
              type: integer
            project_count:
              type: integer
            competition_count:
              type: integer
        self_assessment:
          type: object
          properties:
            communication:
              type: integer
            learning:
              type: integer
            stress_tolerance:
              type: integer
            innovation:
              type: integer
        dimension_scores:
          $ref: "#/components/schemas/DimensionScores"
        completeness_score:
          type: number
        competitiveness_score:
          type: number
        missing_items:
          type: array
          items:
            type: string
        personal_summary:
          type: string
          nullable: true
        summary:
          type: string
        created_at:
          type: string
          format: date-time

    ListStudentProfilesResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentProfile"

    CreateMatchRequest:
      type: object
      required: [student_profile_id, job_id]
      properties:
        student_profile_id:
          type: integer
          minimum: 1
        job_id:
          type: integer
          minimum: 1
        force_recalculate:
          type: boolean
          default: false

    MatchGapItem:
      type: object
      required: [dimension, target_score, current_score, gap, evidence]
      properties:
        dimension:
          type: string
          enum:
            [base_requirements, professional_skills, professional_quality, development_potential]
        target_score:
          type: number
          minimum: 0
          maximum: 100
        current_score:
          type: number
          minimum: 0
          maximum: 100
        gap:
          type: number
        evidence:
          type: array
          items:
            type: string

    MatchExplanationItem:
      type: object
      required: [dimension, reasoning, improvement_actions]
      properties:
        dimension:
          type: string
          enum:
            [base_requirements, professional_skills, professional_quality, development_potential]
        reasoning:
          type: string
        improvement_actions:
          type: array
          items:
            type: string

    MatchResultSummary:
      type: object
      required:
        [
          id,
          student_profile_id,
          job_id,
          job_profile_version,
          scoring_version,
          input_fingerprint,
          from_cache,
          total_score,
          dimension_scores,
          created_at,
        ]
      properties:
        id:
          type: integer
        student_profile_id:
          type: integer
        job_id:
          type: integer
        job_profile_version:
          type: integer
        scoring_version:
          type: string
        input_fingerprint:
          type: string
        from_cache:
          type: boolean
        total_score:
          type: number
          minimum: 0
          maximum: 100
        dimension_scores:
          $ref: "#/components/schemas/DimensionScores"
        created_at:
          type: string
          format: date-time

    MatchResultDetail:
      allOf:
        - $ref: "#/components/schemas/MatchResultSummary"
        - type: object
          required: [gaps, suggestions, explanations]
          properties:
            gaps:
              type: array
              items:
                $ref: "#/components/schemas/MatchGapItem"
            suggestions:
              type: array
              items:
                type: string
            explanations:
              type: array
              items:
                $ref: "#/components/schemas/MatchExplanationItem"

    MatchResultListResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/MatchResultSummary"

    KnowledgeSourceKind:
      type: string
      enum: [job_dataset, resume_text, project_doc]

    KnowledgeNamespace:
      type: string
      enum: [career_runtime, internal_project_docs]

    KnowledgeIndexItem:
      type: object
      properties:
        source_id:
          type: string
        source_path:
          type: string
        title:
          type: string
        text:
          type: string
        section_path:
          type: string
          nullable: true
        job_id:
          type: integer
          nullable: true
        profile_id:
          type: integer
          nullable: true

    KnowledgeDocumentRecord:
      type: object
      required:
        [id, namespace, source_kind, source_id, title, content_digest, created_at, updated_at]
      properties:
        id:
          type: integer
        namespace:
          $ref: "#/components/schemas/KnowledgeNamespace"
        source_kind:
          $ref: "#/components/schemas/KnowledgeSourceKind"
        source_id:
          type: string
        title:
          type: string
        source_path:
          type: string
          nullable: true
        section_path:
          type: string
          nullable: true
        job_id:
          type: integer
          nullable: true
        profile_id:
          type: integer
          nullable: true
        content_digest:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeChunkRecord:
      type: object
      required: [id, document_id, chunk_index, chunk_text, token_count, created_at, updated_at]
      properties:
        id:
          type: integer
        document_id:
          type: integer
        chunk_index:
          type: integer
        chunk_text:
          type: string
        token_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeIndexRequest:
      type: object
      required: [source_kind, items]
      properties:
        namespace:
          $ref: "#/components/schemas/KnowledgeNamespace"
        source_kind:
          $ref: "#/components/schemas/KnowledgeSourceKind"
        force_reindex:
          type: boolean
          default: false
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/KnowledgeIndexItem"

    KnowledgeIndexResponse:
      type: object
      required: [namespace, source_kind, indexed_documents, indexed_chunks, skipped_documents]
      properties:
        namespace:
          $ref: "#/components/schemas/KnowledgeNamespace"
        source_kind:
          $ref: "#/components/schemas/KnowledgeSourceKind"
        indexed_documents:
          type: integer
        indexed_chunks:
          type: integer
        skipped_documents:
          type: integer

    KnowledgeSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        namespace:
          $ref: "#/components/schemas/KnowledgeNamespace"
        source_kinds:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSourceKind"
        student_profile_id:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 20

    KnowledgeSearchResultItem:
      type: object
      required:
        [
          id,
          document_id,
          namespace,
          source_kind,
          source_id,
          title,
          chunk_index,
          chunk_text,
          keyword_score,
          vector_score,
          final_score,
        ]
      properties:
        id:
          type: integer
        document_id:
          type: integer
        namespace:
          $ref: "#/components/schemas/KnowledgeNamespace"
        source_kind:
          $ref: "#/components/schemas/KnowledgeSourceKind"
        source_id:
          type: string
        title:
          type: string
        chunk_index:
          type: integer
        chunk_text:
          type: string
        source_path:
          type: string
          nullable: true
        section_path:
          type: string
          nullable: true
        job_id:
          type: integer
          nullable: true
        profile_id:
          type: integer
          nullable: true
        keyword_score:
          type: number
        vector_score:
          type: number
        final_score:
          type: number

    KnowledgeSearchResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSearchResultItem"

    KnowledgeEvaluationRequest:
      type: object
      properties:
        namespace:
          $ref: "#/components/schemas/KnowledgeNamespace"
        top_k:
          type: integer
          minimum: 1
          maximum: 20

    KnowledgeEvaluationCaseResult:
      type: object
      required: [query, expected_terms, hit, reciprocal_rank, matched_chunk_ids]
      properties:
        query:
          type: string
        expected_terms:
          type: array
          items:
            type: string
        hit:
          type: boolean
        reciprocal_rank:
          type: number
        matched_chunk_ids:
          type: array
          items:
            type: integer

    KnowledgeEvaluationResponse:
      type: object
      required: [namespace, top_k, recall_at_k, mrr, cases]
      properties:
        namespace:
          $ref: "#/components/schemas/KnowledgeNamespace"
        top_k:
          type: integer
        recall_at_k:
          type: number
        mrr:
          type: number
        cases:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeEvaluationCaseResult"

    AgentWarningCode:
      type: string
      enum:
        [
          EVIDENCE_INSUFFICIENT,
          KNOWLEDGE_SEARCH_FAILED,
          REPORT_TEMPLATE_FALLBACK,
          REPORT_GENERATION_FAILED,
          FINAL_SUMMARY_FALLBACK,
        ]

    AgentDeliverable:
      type: string
      enum: [match_analysis, career_report]

    AgentTaskStatus:
      type: string
      enum: [success, partial_success, failed]

    AgentPlanStep:
      type: object
      required: [id, tool, title, purpose]
      properties:
        id:
          type: string
        tool:
          type: string
          enum:
            [task_planning, context_lookup, knowledge_search, match_evaluation, report_generation, final_answer]
        title:
          type: string
        purpose:
          type: string

    AgentStepTraceItem:
      type: object
      required: [step_id, tool, title, status, duration_ms, input_summary, output_summary]
      properties:
        step_id:
          type: string
        tool:
          type: string
          enum:
            [task_planning, context_lookup, knowledge_search, match_evaluation, report_generation, final_answer]
        title:
          type: string
        status:
          type: string
          enum: [success, warning, error, skipped]
        duration_ms:
          type: integer
          minimum: 0
        input_summary:
          type: string
        output_summary:
          type: string
        error_code:
          type: string

    AgentTaskRequest:
      type: object
      required: [student_profile_id, job_id]
      properties:
        student_profile_id:
          type: integer
          minimum: 1
        job_id:
          type: integer
          minimum: 1
        objective:
          type: string
          maxLength: 200
        deliverables:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/AgentDeliverable"
        force_recalculate:
          type: boolean
          default: false
        top_k:
          type: integer
          minimum: 1
          maximum: 10
          default: 5

    AgentTaskResult:
      type: object
      required: [summary, knowledge_hits, match_result, report, warnings]
      properties:
        summary:
          type: string
        knowledge_hits:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSearchResultItem"
        match_result:
          allOf:
            - $ref: "#/components/schemas/MatchResultDetail"
          nullable: true
        report:
          allOf:
            - $ref: "#/components/schemas/CareerReportRecord"
          nullable: true
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/AgentWarningCode"

    AgentTaskResponse:
      type: object
      required:
        [
          task_id,
          trace_id,
          status,
          student_profile_id,
          job_id,
          objective,
          deliverables,
          model,
          planned_steps,
          step_trace,
          result,
          created_at,
          finished_at,
        ]
      properties:
        task_id:
          type: integer
        trace_id:
          type: string
        status:
          $ref: "#/components/schemas/AgentTaskStatus"
        student_profile_id:
          type: integer
        job_id:
          type: integer
        objective:
          type: string
        deliverables:
          type: array
          items:
            $ref: "#/components/schemas/AgentDeliverable"
        model:
          type: string
          nullable: true
        planned_steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentPlanStep"
        step_trace:
          type: array
          items:
            $ref: "#/components/schemas/AgentStepTraceItem"
        result:
          $ref: "#/components/schemas/AgentTaskResult"
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    CareerReportSection:
      type: object
      required: [key, title, content]
      properties:
        key:
          type: string
          enum:
            [overview, match_analysis, strengths, gaps_and_actions, short_term_plan, mid_term_plan]
        title:
          type: string
        content:
          type: string

    CareerReportSummary:
      type: object
      required:
        [id, match_id, version, student_profile_id, job_id, total_score, created_at, updated_at]
      properties:
        id:
          type: integer
        match_id:
          type: integer
        version:
          type: integer
        student_profile_id:
          type: integer
        job_id:
          type: integer
        total_score:
          type: number
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CareerReportRecord:
      allOf:
        - $ref: "#/components/schemas/CareerReportSummary"
        - type: object
          required: [sections]
          properties:
            sections:
              type: array
              items:
                $ref: "#/components/schemas/CareerReportSection"

    CreateReportRequest:
      type: object
      required: [match_id]
      properties:
        match_id:
          type: integer
          minimum: 1

    UpdateReportRequest:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/CareerReportSection"

    ReportListResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CareerReportSummary"

    CreateReportExportRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [pdf]

    CareerReportExportRecord:
      type: object
      required: [id, report_id, format, file_name, file_size_bytes, created_at, download_path]
      properties:
        id:
          type: integer
        report_id:
          type: integer
        format:
          type: string
          enum: [pdf]
        file_name:
          type: string
        file_size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        download_path:
          type: string

    ReportExportListResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CareerReportExportRecord"
