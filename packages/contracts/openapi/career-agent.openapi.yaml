openapi: 3.0.3
info:
  title: Career Agent API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /healthz:
    get:
      summary: Health Check
      responses:
        "200":
          description: OK

  /api/v2/jobs/pipeline/run:
    post:
      summary: Run Jobs Intelligence Pipeline
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [cleanse_agent_portraits]
                  default: cleanse_agent_portraits
      responses:
        "202":
          description: Pipeline task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPipelineTaskRecord"

  /api/v2/job-portraits/manual:
    get:
      summary: List Manual Job Portraits
      responses:
        "200":
          description: Manual job portrait list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualJobPortraitListResponse"

  /api/v2/job-portraits/manual/{job_name}/comic:
    post:
      summary: Generate Manual Job Portrait Comic
      parameters:
        - in: path
          name: job_name
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                comic_context:
                  $ref: "#/components/schemas/JobPortraitComicContext"
      responses:
        "200":
          description: Generated comic image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateJobPortraitComicResponse"
        "404":
          description: Manual job portrait not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v2/jobs/pipeline/tasks/{task_id}:
    get:
      summary: Get Jobs Pipeline Task
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Pipeline task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPipelineTaskRecord"

  /api/v2/jobs/pipeline/tasks/{task_id}/failures:
    get:
      summary: List Pipeline Task Failures
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Pipeline task failure list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPipelineFailureListResponse"

  /api/v2/jobs/pipeline/retry-queue:
    get:
      summary: List Pipeline Retry Queue
      parameters:
        - in: query
          name: task_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, processing, done, failed]
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Pipeline retry queue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPipelineRetryQueueListResponse"

  /api/v2/career-paths/targets:
    get:
      summary: List Built Career Path Targets V2
      responses:
        "200":
          description: Career path target options already present in graph storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPathTargetOptionsResponse"

  /api/v2/career-paths/jobs/{job_id}:
    get:
      summary: Get Career Path Graph V2
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: depth
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 2
      responses:
        "200":
          description: Career path graph result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPathGraphResponse"

  /api/v2/matches:
    post:
      summary: Create Match Result V2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequest"
      responses:
        "201":
          description: Match result created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultDetail"
    get:
      summary: List Match Results V2
      parameters:
        - in: query
          name: student_profile_id
          schema:
            type: integer
        - in: query
          name: job_id
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Match result list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultListResponse"

  /api/v2/matches/{match_id}:
    get:
      summary: Get Match Result Detail V2
      parameters:
        - in: path
          name: match_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match result detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultDetail"

  /api/v2/reports:
    post:
      summary: Create Career Report V2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Career report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReportRecord"
    get:
      summary: List Career Reports V2
      parameters:
        - in: query
          name: match_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Career report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"

  /api/v2/reports/{report_id}:
    get:
      summary: Get Career Report Detail V2
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Career report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReportRecord"
    patch:
      summary: Update Career Report V2
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: Career report updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReportRecord"

  /api/v2/reports/{report_id}/exports:
    post:
      summary: Create Career Report Export V2
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportExportRequest"
      responses:
        "201":
          description: Export created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReportExportRecord"
    get:
      summary: List Career Report Exports V2
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Export list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExportListResponse"

  /api/v2/report-exports/{export_id}/download:
    get:
      summary: Download Report Export V2
      parameters:
        - in: path
          name: export_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF binary stream

  /api/v2/ai/tasks:
    post:
      summary: Create AI Task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTaskRequest"
      responses:
        "201":
          description: AI task completed or partially completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskResponse"
        "400":
          description: Invalid AI request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student profile or job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI orchestration or model call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v2/ai/resume-html:
    post:
      summary: Generate Resume HTML
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeHtmlRequest"
      responses:
        "201":
          description: Resume HTML generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeHtmlResponse"
        "400":
          description: Invalid resume generation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Resume generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: List Generated Resume HTML Records
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Resume HTML record list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeHtmlListResponse"
        "400":
          description: Invalid list query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v2/ai/resume-html/{resume_id}:
    get:
      summary: Get Generated Resume HTML Record
      parameters:
        - in: path
          name: resume_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Resume HTML record detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeHtmlRecord"
        "404":
          description: Resume record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v2/ai/chat:
    post:
      summary: Create AI Task From Chat-Compatible Path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTaskRequest"
      responses:
        "201":
          description: AI task completed or partially completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskResponse"
        "400":
          description: Invalid AI request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student profile or job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI orchestration or model call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v2/ai/tasks/{task_id}:
    get:
      summary: Get AI Task
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: AI task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskResponse"
        "404":
          description: AI task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

