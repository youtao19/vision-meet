openapi: 3.0.3
info:
  title: Career Agent API - Student Matching Delta
  version: 0.1.0
  description: |
    本文件描述“学生画像 + 人岗匹配四维评分 + 匹配结果解释”功能的新增/变更契约。
    实施时需合并到 packages/contracts/openapi/career-agent.openapi.yaml。

paths:
  /api/v1/profile/resume:
    post:
      summary: Create Student Profile From Resume
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, target_role]
              properties:
                file:
                  type: string
                  format: binary
                  description: 简历文件
                target_role:
                  type: string
                  minLength: 1
                name:
                  type: string
                parse_mode:
                  type: string
                  enum: [strict, tolerant]
                  default: tolerant
      responses:
        "201":
          description: Created student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Resume parse failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/matches:
    post:
      summary: Create Job Match Result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequest"
      responses:
        "201":
          description: Match result created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultDetail"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student profile or job profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List Job Match Results
      parameters:
        - in: query
          name: student_profile_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: job_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Match result list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultListResponse"
        "400":
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/matches/{match_id}:
    get:
      summary: Get Match Result Detail
      parameters:
        - in: path
          name: match_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Match result detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResultDetail"
        "404":
          description: Match result not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    DimensionScores:
      type: object
      required: [base_requirements, professional_skills, professional_quality, development_potential]
      properties:
        base_requirements:
          type: number
          minimum: 0
          maximum: 100
        professional_skills:
          type: number
          minimum: 0
          maximum: 100
        professional_quality:
          type: number
          minimum: 0
          maximum: 100
        development_potential:
          type: number
          minimum: 0
          maximum: 100

    StudentProfile:
      type: object
      required: [id, name, target_role, skills, dimension_scores, completeness_score, competitiveness_score, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        target_role:
          type: string
        skills:
          type: array
          items:
            type: string
        certificates:
          type: array
          items:
            type: string
        dimension_scores:
          $ref: "#/components/schemas/DimensionScores"
        completeness_score:
          type: number
        competitiveness_score:
          type: number
        summary:
          type: string
        created_at:
          type: string
          format: date-time

    CreateMatchRequest:
      type: object
      required: [student_profile_id, job_id]
      properties:
        student_profile_id:
          type: integer
          minimum: 1
        job_id:
          type: integer
          minimum: 1
        force_recalculate:
          type: boolean
          default: false

    MatchGapItem:
      type: object
      required: [dimension, target_score, current_score, gap]
      properties:
        dimension:
          type: string
          enum: [base_requirements, professional_skills, professional_quality, development_potential]
        target_score:
          type: number
          minimum: 0
          maximum: 100
        current_score:
          type: number
          minimum: 0
          maximum: 100
        gap:
          type: number
        evidence:
          type: array
          items:
            type: string

    MatchExplanationItem:
      type: object
      required: [dimension, reasoning, improvement_actions]
      properties:
        dimension:
          type: string
          enum: [base_requirements, professional_skills, professional_quality, development_potential]
        reasoning:
          type: string
        improvement_actions:
          type: array
          items:
            type: string

    MatchResultSummary:
      type: object
      required: [id, student_profile_id, job_id, total_score, dimension_scores, created_at]
      properties:
        id:
          type: integer
        student_profile_id:
          type: integer
        job_id:
          type: integer
        total_score:
          type: number
          minimum: 0
          maximum: 100
        dimension_scores:
          $ref: "#/components/schemas/DimensionScores"
        created_at:
          type: string
          format: date-time

    MatchResultDetail:
      allOf:
        - $ref: "#/components/schemas/MatchResultSummary"
        - type: object
          required: [job_profile_version, scoring_version, input_fingerprint, from_cache, gaps, suggestions, explanations]
          properties:
            job_profile_version:
              type: integer
            scoring_version:
              type: string
            input_fingerprint:
              type: string
            from_cache:
              type: boolean
            gaps:
              type: array
              items:
                $ref: "#/components/schemas/MatchGapItem"
            suggestions:
              type: array
              items:
                type: string
            explanations:
              type: array
              items:
                $ref: "#/components/schemas/MatchExplanationItem"

    MatchResultListResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/MatchResultSummary"

    ErrorResponse:
      type: object
      required: [code, message, detail]
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          oneOf:
            - type: string
            - type: object
        trace_id:
          type: string
