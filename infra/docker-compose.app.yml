name: career-agent-app

x-backend-env: &backend-env
  APP_ENV: docker
  PORT: "8000"
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: career_agent
  PGUSER: career
  PGPASSWORD: career_dev_password
  NEO4J_URI: neo4j://neo4j:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: career_dev_password
  REPORT_EXPORT_DIR: /app/apps/backend/storage/exports/reports
  JOB_PICTURE_BOOK_OUTPUT_DIR: /app/apps/backend/storage/job-picture-books
  AGENT_PI_DIR: /app/.career-agent/pi-agent
  AGENT_SESSION_STORE_DIR: /app/.career-agent/pi-agent/sessions
  TTS_ENGINE: volcengine

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_agent
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career_agent"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/career_dev_password
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p career_dev_password 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  init:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - path: ./env/backend.env.example
        required: true
      - path: ./env/backend.env
        required: false
    environment:
      <<: *backend-env
    volumes:
      - ../apps/backend/storage:/app/apps/backend/storage
      - agent_data:/app/.career-agent/pi-agent
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: ["sh", "infra/docker/init.sh"]
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./env/backend.env.example
        required: true
      - path: ./env/backend.env
        required: false
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ../apps/backend/storage:/app/apps/backend/storage
      - agent_data:/app/.career-agent/pi-agent
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["sh", "infra/docker/backend-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8000/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5173
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pg_data:
    external: true
    name: infra_pg_data
  neo4j_data:
    external: true
    name: infra_neo4j_data
  agent_data:
